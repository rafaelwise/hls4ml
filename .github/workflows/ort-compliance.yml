name: OSS Review Toolkit Compliance Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows you to manually trigger this workflow from the Actions tab

jobs:
  ort-scan:
    name: Run ORT Analysis, Scanner, Advisor, and Evaluator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Java/Node/Dotnet/etc. depending on your project type
      # so the ORT Analyzer can successfully resolve dependencies.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Fix 1: Set up Python so the environment can parse pyproject.toml
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # Fix 2: Create a virtual environment and generate lock data for ORT to find
      - name: Install Python Dependencies & Generate Lockfile
        run: |
          python -m pip install --upgrade pip setuptools wheel pip-tools
          # Compiles pyproject.toml dependencies into a standard requirements.txt lock matrix
          pip-compile pyproject.toml -o requirements.txt

      # Run ORT via container or CLI action to analyze, scan, advise, and evaluate
      - name: Run OSS Review Toolkit
        id: ort
        uses: oss-review-toolkit/ort-ci-github-action@main
        with:
          project-path: '.'
          # Optional: Configure arguments to run analyzer, scanner, advisor (vulnerabilities), and evaluator
          #ort-arguments: '--info analyze --info scan --info advise --info evaluate --info report -f CycloneDX -f SpdxDocumentJson'
          run: 'analyze,scan,advise,evaluate,report'
          report-formats: 'CycloneDX,SpdxDocumentJson,HtmlTemplate'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fix 4: Capture the reports out of the workspace using global wildcards
      - name: Upload ORT Result & SBOM Reports
        uses: actions/upload-artifact@v4
        with:
          name: compliance-and-sbom-reports
          path: |
            **/ort-results/*
            **/*result*.yml
            **/*report*.html
            **/*.bom.json
